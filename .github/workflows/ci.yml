name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

jobs:
  # Job 1: Code Quality (Fast - runs first)
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest kafka-python

      - name: Run ruff linter
        run: |
          ruff check . --output-format=github

      - name: Run ruff formatter check
        run: |
          ruff format --check .

      - name: Run mypy type check
        run: |
          mypy services/ flink/jobs/ airflow/dags/ --ignore-missing-imports || true

  # Job X: Mypy strict type checks (non-blocking initially)
  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run mypy (strict rules)
        run: |
          # Fail if any typing issues per pyproject.toml (disallow_untyped_defs enabled)
          mypy .

  # Job X+1: Mypy strict profile (informational, non-blocking)
  mypy-strict:
    name: Mypy Strict Profile
    runs-on: ubuntu-latest
    needs: mypy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run mypy with strict profile (non-blocking)
        run: |
          mypy --config-file mypy-strict.ini . || true

  # Job 2: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov kafka-python

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short -q

  # Job 3: Integration Test (Full pipeline)
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kafka-python pytest requests

      - name: Create .env file
        run: |
          cat > local/.env << EOF
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          EOF

      - name: Start Docker Compose services
        run: |
          cd local
          docker compose up -d redpanda minio hive-metastore trino flink-jobmanager flink-taskmanager
          echo "Waiting for services to initialize..."
          sleep 90

      - name: Check service health
        run: |
          echo "Checking Redpanda..."
          docker exec local-redpanda-1 rpk cluster health || true
          
          echo "Checking Flink..."
          curl -s http://localhost:8081/overview || echo "Flink not ready yet"
          
          echo "Checking Trino..."
          curl -s http://localhost:8082/v1/info || echo "Trino not ready yet"

      - name: Create Kafka topics
        run: |
          docker exec local-redpanda-1 rpk topic create orders.events --partitions 1
          docker exec local-redpanda-1 rpk topic create alerts.events --partitions 1
          docker exec local-redpanda-1 rpk topic create kpi.minute --partitions 1

      - name: Deploy Flink jobs
        run: |
          echo "Deploying bronze_writer..."
          docker exec local-flink-jobmanager-1 /opt/flink/bin/flink run -py /opt/flink/jobs/bronze_writer.py || true
          
          echo "Deploying silver_order_state..."
          docker exec local-flink-jobmanager-1 /opt/flink/bin/flink run -py /opt/flink/jobs/silver_order_state.py || true
          
          echo "Waiting for jobs to start..."
          sleep 30

      - name: Generate test events
        run: |
          python services/event_generator/main.py --events 100 --topic orders.events --brokers localhost:29092
          echo "Generated 100 test events"

      - name: Wait for data processing
        run: |
          echo "Waiting for Flink to process events..."
          sleep 90

      - name: Verify data in Trino
        id: verify_data
        run: |
          echo "Querying Iceberg tables..."
          
          # Query bronze table
          BRONZE_COUNT=$(docker exec local-trino-1 trino --execute "SELECT COUNT(*) FROM iceberg.lakehouse.bronze_order_events" 2>/dev/null | grep -o '[0-9]*' | head -1 || echo "0")
          echo "Bronze table count: $BRONZE_COUNT"
          
          # Verify count > 0
          if [ "$BRONZE_COUNT" -gt "0" ]; then
            echo "✓ Integration test PASSED: Found $BRONZE_COUNT events in bronze table"
            echo "bronze_count=$BRONZE_COUNT" >> $GITHUB_OUTPUT
          else
            echo "✗ Integration test FAILED: No events in bronze table"
            exit 1
          fi

      - name: Run integration test assertions
        run: |
          pytest tests/test_integration.py -v --tb=short || true

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Flink JobManager Logs ==="
          docker logs local-flink-jobmanager-1 --tail 100 || true
          
          echo "=== Flink TaskManager Logs ==="
          docker logs local-flink-taskmanager-1 --tail 100 || true
          
          echo "=== Redpanda Logs ==="
          docker logs local-redpanda-1 --tail 50 || true

      - name: Cleanup
        if: always()
        run: |
          cd local
          docker compose down -v --remove-orphans

  # Job 4: DAG Validation
  airflow-dags:
    name: Validate Airflow DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Airflow
        run: |
          pip install apache-airflow==2.7.3

      - name: Validate DAG syntax
        run: |
          export AIRFLOW_HOME=$(pwd)/airflow
          python -c "
          import sys
          sys.path.insert(0, 'airflow/dags')
          
          # Import and validate each DAG
          try:
              import backfill_range
              print('✓ backfill_range.py is valid')
          except Exception as e:
              print(f'✗ backfill_range.py failed: {e}')
              sys.exit(1)
          
          try:
              import data_sanity_checks
              print('✓ data_sanity_checks.py is valid')
          except Exception as e:
              print(f'✗ data_sanity_checks.py failed: {e}')
              sys.exit(1)
          
          print('All DAGs validated successfully!')
          "

  # Summary job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, integration, airflow-dags, mypy]
    if: success()
    steps:
      - name: All checks passed
        run: |
          echo "🎉 All CI checks passed!"
          echo ""
          echo "Summary:"
          echo "  ✓ Lint & Type Check"
          echo "  ✓ Unit Tests"
          echo "  ✓ Integration Test"
          echo "  ✓ Airflow DAG Validation"
          echo "  ✓ Mypy Type Check"
