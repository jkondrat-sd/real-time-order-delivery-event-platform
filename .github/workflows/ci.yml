name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Minimize GITHUB_TOKEN permissions
permissions:
  contents: read

env:
  JAVA_VERSION: '11'
  MAVEN_VERSION: '3.9.6'

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate docker-compose
        run: |
          docker-compose config
      
      - name: Check shell scripts
        run: |
          if command -v shellcheck &> /dev/null; then
            find . -type f -name "*.sh" -exec shellcheck {} \;
          else
            echo "Shellcheck not available, skipping"
          fi
      
      - name: Validate Python code (Airflow DAGs)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install black flake8 pylint
      
      - name: Format check with black
        run: |
          black --check airflow/ || echo "Black formatting issues found"
      
      - name: Lint Python with flake8
        run: |
          flake8 airflow/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

  build-flink-jobs:
    name: Build Flink Jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build KPI Aggregator
        working-directory: ./flink/kpi-aggregator
        run: |
          mvn clean package -DskipTests
      
      - name: Build Complex Event Detector
        working-directory: ./flink/complex-event-detector
        run: |
          mvn clean package -DskipTests
      
      - name: Upload Flink artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flink-jobs
          path: |
            flink/kpi-aggregator/target/*.jar
            flink/complex-event-detector/target/*.jar
          retention-days: 7

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-flink-jobs]
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Flink artifacts
        uses: actions/download-artifact@v4
        with:
          name: flink-jobs
          path: flink/
      
      - name: Start infrastructure
        run: |
          docker-compose up -d zookeeper kafka schema-registry minio
          echo "Waiting for services to be ready..."
          sleep 30
      
      - name: Check service health
        run: |
          docker-compose ps
          
          # Check Kafka
          docker-compose exec -T kafka kafka-broker-api-versions \
            --bootstrap-server localhost:9092 || exit 1
          
          # Check MinIO
          curl -f http://localhost:9000/minio/health/live || exit 1
      
      - name: Create Kafka topics
        run: |
          docker-compose exec -T kafka kafka-topics --create \
            --bootstrap-server localhost:9092 \
            --replication-factor 1 \
            --partitions 3 \
            --topic order-events \
            --if-not-exists
          
          docker-compose exec -T kafka kafka-topics --create \
            --bootstrap-server localhost:9092 \
            --replication-factor 1 \
            --partitions 3 \
            --topic delivery-events \
            --if-not-exists
      
      - name: Test Kafka producer/consumer
        run: |
          # Produce test message
          echo '{"test":"message"}' | docker-compose exec -T kafka \
            kafka-console-producer \
            --broker-list localhost:9092 \
            --topic order-events
          
          # Consume and verify
          timeout 5 docker-compose exec -T kafka \
            kafka-console-consumer \
            --bootstrap-server localhost:9092 \
            --topic order-events \
            --from-beginning \
            --max-messages 1 || true
      
      - name: Show logs on failure
        if: failure()
        run: |
          docker-compose logs
      
      - name: Cleanup
        if: always()
        run: |
          docker-compose down -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for uploading SARIF results
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  docker-compose-test:
    name: Docker Compose Full Stack Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      
      - name: Start full stack
        run: |
          docker-compose up -d
          echo "Waiting for services to initialize..."
          sleep 90
      
      - name: Check all services
        run: |
          docker-compose ps
          
          # Verify critical services are running
          docker-compose ps | grep -q "kafka.*Up" || exit 1
          docker-compose ps | grep -q "minio.*Up" || exit 1
          docker-compose ps | grep -q "prometheus.*Up" || exit 1
          docker-compose ps | grep -q "grafana.*Up" || exit 1
      
      - name: Test service endpoints
        run: |
          # Test Prometheus
          curl -f http://localhost:9090/-/healthy || exit 1
          
          # Test Grafana
          curl -f http://localhost:3000/api/health || exit 1
          
          # Test MinIO
          curl -f http://localhost:9000/minio/health/live || exit 1
      
      - name: Cleanup
        if: always()
        run: |
          docker-compose logs > docker-compose.log
          docker-compose down -v
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
          retention-days: 3
